---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: kubeflow-promotion-e2e-gate
spec:
  description: |
    E2E gate for kubeflow branch promotions (main->stable, stable->v1.10-branch).
    Supports two cluster modes:
      - "byo" (default): Uses a pre-existing OCP cluster with credentials from a
        Kubernetes Secret. Includes cluster locking (Lease) and cleanup between runs.
      - "hypershift": Provisions an ephemeral HyperShift cluster via EaaS.
    Installs ODH from CatalogSource, patches controller images with PR-built
    versions, and runs the opendatahub-tests workbenches suite.
  params:
    - description: List of components in the group
      name: group-components
      type: string
    - description: CatalogSource index image for the ODH operator
      name: catalog-source-image
      type: string
      default: quay.io/opendatahub/opendatahub-operator-catalog:odh-stable
    - name: cluster-mode
      type: string
      default: "byo"
      description: >-
        Cluster provisioning mode. "byo" uses a pre-existing OCP cluster
        (credentials from cluster-credentials workspace). "hypershift" provisions
        an ephemeral HyperShift cluster via EaaS.

  workspaces:
    - name: git-auth
      optional: true
    - name: cluster-credentials
      optional: true
      description: >-
        Secret workspace containing the BYO cluster kubeconfig.
        Required when cluster-mode is "byo". The secret must have a "kubeconfig" key.
    - name: shared-data
      description: Shared workspace for passing kubeconfig between tasks.

  tasks:
    # ====================================================================
    # Phase 1: Resolve and audit component images
    # ====================================================================

    - name: generate-snapshot
      description: Resolve the latest built images for the group components
      params:
        - name: COMPONENTS
          value: $(params.group-components)
      workspaces:
      - name: basic-auth
        workspace: git-auth
      taskRef:
        resolver: git
        params:
        - name: url
          value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
        - name: revision
          value: main
        - name: pathInRepo
          value: konflux-tekton-tasks/generate-snapshot-for-group-testing/0.1/generate-snapshot-for-group-testing.yaml

    - name: audit-snapshot
      runAfter:
        - generate-snapshot
      params:
        - name: COMPONENTS
          value: $(params.group-components)
      taskSpec:
        params:
          - name: COMPONENTS
            description: List of components in the group
        steps:
          - name: audit-snapshot
            image: quay.io/konflux-ci/konflux-test:stable
            workingDir: /workspace
            env:
              - name: SNAPSHOT
                value: $(tasks.generate-snapshot.results.SNAPSHOT)
              - name: COMPONENTS
                value: $(params.COMPONENTS)
            script: |
              #!/bin/bash
              set -e
              echo "SNAPSHOT=${SNAPSHOT}"

              FALLBACK_DETECTED=0
              while IFS= read -r row; do
                  COMPONENT_NAME=$(echo "$row" | base64 -d | jq -r '.key')
                  IMAGE=$(jq -r --arg component_name "${COMPONENT_NAME}" '.[$component_name].image' <<< "${SNAPSHOT}")
                  IMAGE_TAG=$(jq -r --arg component_name "${COMPONENT_NAME}" '.[$component_name].image_tag' <<< "${SNAPSHOT}")
                  GIT_COMMIT=$(jq -r --arg component_name "${COMPONENT_NAME}" '.[$component_name]."git.commit"' <<< "${SNAPSHOT}")
                  GIT_URL=$(jq -r --arg component_name "${COMPONENT_NAME}" '.[$component_name]."git.url"' <<< "${SNAPSHOT}")
                  echo "${COMPONENT_NAME} IMAGE: ${IMAGE}"
                  echo "  IMAGE_TAG=${IMAGE_TAG}"
                  echo "  GIT_COMMIT=${GIT_COMMIT}"
                  echo "  GIT_URL=${GIT_URL}"

                  if [[ "${IMAGE_TAG}" == "odh-stable" ]]; then
                      echo "  ERROR: ${COMPONENT_NAME} resolved to fallback tag 'odh-stable' instead of a PR-built image"
                      FALLBACK_DETECTED=1
                  fi
              done < <(echo "$COMPONENTS" | jq -r 'to_entries[] | @base64')

              # TODO: Re-enable this once we have a way to ensure the component build pipelines ran successfully for this PR before triggering the e2e gate.
              # if [[ "${FALLBACK_DETECTED}" -eq 1 ]]; then
              #     echo ""
              #     echo "FATAL: One or more components resolved to the 'odh-stable' fallback tag."
              #     echo "This means no PR-built images (odh-pr-<PR_NUMBER>) were found in Quay."
              #     echo "Ensure the component build pipelines ran successfully for this PR before triggering the e2e gate."
              #     exit 1
              # fi

    # ====================================================================
    # Phase 2a: BYO cluster path (when cluster-mode == "byo")
    # ====================================================================

    - name: acquire-cluster-lock
      runAfter:
        - audit-snapshot
      when:
        - input: $(params.cluster-mode)
          operator: in
          values: ["byo"]
      taskSpec:
        params:
          - name: pipeline-run-name
            type: string
        steps:
          - name: acquire-lock
            image: quay.io/konflux-ci/konflux-test:stable
            env:
              - name: HOLDER
                value: "$(params.pipeline-run-name)"
            script: |
              #!/bin/bash
              set -e

              LEASE_NAME="e2e-gate-cluster-lock"
              LEASE_DURATION=10800  # 3 hours safety net
              TIMEOUT=3600          # 1 hour max wait
              NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
              ELAPSED=0
              BACKOFF=15

              echo "=== Acquiring cluster lock ==="
              echo "Lease: ${LEASE_NAME} in namespace ${NAMESPACE}"
              echo "Holder: ${HOLDER}"

              while [[ ${ELAPSED} -lt ${TIMEOUT} ]]; do
                  CURRENT=$(kubectl get lease "${LEASE_NAME}" -n "${NAMESPACE}" -o json 2>/dev/null || echo "")

                  if [[ -z "${CURRENT}" ]]; then
                      echo "Lease does not exist, creating..."
                      kubectl apply -f - <<EOF
              apiVersion: coordination.k8s.io/v1
              kind: Lease
              metadata:
                name: ${LEASE_NAME}
                namespace: ${NAMESPACE}
              spec:
                holderIdentity: "${HOLDER}"
                leaseDurationSeconds: ${LEASE_DURATION}
                acquireTime: "$(date -u +%Y-%m-%dT%H:%M:%S.000000Z)"
                renewTime: "$(date -u +%Y-%m-%dT%H:%M:%S.000000Z)"
              EOF
                      echo "Lock acquired."
                      exit 0
                  fi

                  CURRENT_HOLDER=$(echo "${CURRENT}" | jq -r '.spec.holderIdentity // ""')
                  RENEW_TIME=$(echo "${CURRENT}" | jq -r '.spec.renewTime // ""')
                  DURATION=$(echo "${CURRENT}" | jq -r '.spec.leaseDurationSeconds // 0')

                  if [[ "${CURRENT_HOLDER}" == "${HOLDER}" ]]; then
                      echo "Lock already held by us, refreshing."
                      kubectl patch lease "${LEASE_NAME}" -n "${NAMESPACE}" \
                          --type=merge -p "{\"spec\":{\"renewTime\":\"$(date -u +%Y-%m-%dT%H:%M:%S.000000Z)\"}}"
                      exit 0
                  fi

                  EXPIRED=false
                  if [[ -n "${RENEW_TIME}" && "${DURATION}" -gt 0 ]]; then
                      RENEW_EPOCH=$(date -d "${RENEW_TIME}" +%s 2>/dev/null || echo 0)
                      NOW_EPOCH=$(date +%s)
                      if [[ $(( NOW_EPOCH - RENEW_EPOCH )) -gt ${DURATION} ]]; then
                          EXPIRED=true
                      fi
                  fi

                  if [[ "${EXPIRED}" == "true" ]]; then
                      echo "Lease expired (held by ${CURRENT_HOLDER}), taking over..."
                      kubectl patch lease "${LEASE_NAME}" -n "${NAMESPACE}" \
                          --type=merge -p "{\"spec\":{\"holderIdentity\":\"${HOLDER}\",\"acquireTime\":\"$(date -u +%Y-%m-%dT%H:%M:%S.000000Z)\",\"renewTime\":\"$(date -u +%Y-%m-%dT%H:%M:%S.000000Z)\"}}"
                      echo "Lock acquired (expired takeover)."
                      exit 0
                  fi

                  echo "Lock held by '${CURRENT_HOLDER}', waiting ${BACKOFF}s... (${ELAPSED}s/${TIMEOUT}s elapsed)"
                  sleep ${BACKOFF}
                  ELAPSED=$((ELAPSED + BACKOFF))
                  if [[ ${BACKOFF} -lt 120 ]]; then
                      BACKOFF=$((BACKOFF * 2))
                      if [[ ${BACKOFF} -gt 120 ]]; then
                          BACKOFF=120
                      fi
                  fi
              done

              echo "ERROR: Timed out waiting for cluster lock after ${TIMEOUT}s"
              echo "Current holder: $(kubectl get lease ${LEASE_NAME} -n ${NAMESPACE} -o jsonpath='{.spec.holderIdentity}' 2>/dev/null || echo 'unknown')"
              exit 1
      params:
        - name: pipeline-run-name
          value: $(context.pipelineRun.name)

    - name: byo-prepare
      runAfter:
        - acquire-cluster-lock
      when:
        - input: $(params.cluster-mode)
          operator: in
          values: ["byo"]
      workspaces:
        - name: cluster-credentials
          workspace: cluster-credentials
        - name: shared-data
          workspace: shared-data
      taskSpec:
        workspaces:
          - name: cluster-credentials
          - name: shared-data
        steps:
          - name: write-kubeconfig
            image: quay.io/konflux-ci/konflux-test:stable
            script: |
              #!/bin/bash
              set -ex

              echo "=== Copying BYO cluster kubeconfig ==="
              if [[ ! -f "$(workspaces.cluster-credentials.path)/kubeconfig" ]]; then
                  echo "ERROR: kubeconfig not found in cluster-credentials workspace"
                  echo "Ensure the e2e-cluster-credentials secret has a 'kubeconfig' key"
                  ls -la "$(workspaces.cluster-credentials.path)/" || true
                  exit 1
              fi

              cp "$(workspaces.cluster-credentials.path)/kubeconfig" "$(workspaces.shared-data.path)/kubeconfig"
              echo "Kubeconfig written to shared workspace"

              echo "=== Verifying cluster access ==="
              export KUBECONFIG="$(workspaces.shared-data.path)/kubeconfig"
              oc whoami
              oc version

          - name: clean-cluster
            image: quay.io/rhoai/rhoai-task-toolset:kubeflow
            env:
              - name: KUBECONFIG
                value: "$(workspaces.shared-data.path)/kubeconfig"
            workingDir: /workspace
            script: |
              #!/bin/bash
              set -e

              echo "=== Cleaning up existing ODH/RHOAI installation ==="

              echo "--- Deleting DataScienceCluster ---"
              oc delete dsc --all --timeout=120s 2>/dev/null || true

              echo "--- Deleting DSCInitialization ---"
              oc delete dsci --all --timeout=120s 2>/dev/null || true

              echo "--- Deleting operator Subscription ---"
              oc delete subscription --all -n redhat-ods-operator --timeout=60s 2>/dev/null || true

              echo "--- Deleting CSVs ---"
              oc delete csv --all -n redhat-ods-operator --timeout=60s 2>/dev/null || true

              echo "--- Deleting CatalogSource ---"
              oc delete catalogsource odh-operator-catalog -n openshift-marketplace --timeout=60s 2>/dev/null || true

              echo "--- Deleting OperatorGroup ---"
              oc delete operatorgroup --all -n redhat-ods-operator --timeout=60s 2>/dev/null || true

              echo "--- Deleting operator namespaces ---"
              for ns in redhat-ods-operator redhat-ods-applications redhat-ods-monitoring rhods-notebooks; do
                  if oc get namespace "${ns}" &>/dev/null; then
                      echo "  Deleting namespace ${ns}"
                      oc delete namespace "${ns}" --timeout=180s 2>/dev/null || true
                  fi
              done

              echo "--- Waiting for namespaces to be fully deleted ---"
              for ns in redhat-ods-operator redhat-ods-applications redhat-ods-monitoring rhods-notebooks; do
                  if oc get namespace "${ns}" &>/dev/null; then
                      echo "  Waiting for namespace ${ns}..."
                      oc wait --for=delete "namespace/${ns}" --timeout=180s 2>/dev/null || true
                  fi
              done

              echo "=== Cluster cleanup complete ==="

    # ====================================================================
    # Phase 2b: HyperShift path (when cluster-mode == "hypershift")
    # ====================================================================

    - name: provision-eaas-space
      runAfter:
        - audit-snapshot
      when:
        - input: $(params.cluster-mode)
          operator: in
          values: ["hypershift"]
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/build-definitions.git
          - name: revision
            value: main
          - name: pathInRepo
            value: task/eaas-provision-space/0.1/eaas-provision-space.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)

    - name: provision-cluster
      runAfter:
        - provision-eaas-space
      when:
        - input: $(params.cluster-mode)
          operator: in
          values: ["hypershift"]
      taskSpec:
        results:
          - name: clusterName
            value: "$(steps.create-cluster.results.clusterName)"
        steps:
          - name: get-supported-versions
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-get-supported-ephemeral-cluster-versions/0.1/eaas-get-supported-ephemeral-cluster-versions.yaml
            params:
              - name: eaasSpaceSecretRef
                value: $(tasks.provision-eaas-space.results.secretRef)
          - name: pick-version
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-get-latest-openshift-version-by-prefix/0.1/eaas-get-latest-openshift-version-by-prefix.yaml
            params:
              - name: prefix
                value: "$(steps.get-supported-versions.results.versions[0])."
          - name: create-cluster
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-create-ephemeral-cluster-hypershift-aws/0.1/eaas-create-ephemeral-cluster-hypershift-aws.yaml
            params:
              - name: eaasSpaceSecretRef
                value: $(tasks.provision-eaas-space.results.secretRef)
              - name: version
                value: "$(steps.pick-version.results.version)"
              - name: instanceType
                value: m5.2xlarge

    - name: hypershift-prepare
      runAfter:
        - provision-cluster
      when:
        - input: $(params.cluster-mode)
          operator: in
          values: ["hypershift"]
      workspaces:
        - name: shared-data
          workspace: shared-data
      taskSpec:
        workspaces:
          - name: shared-data
        volumes:
          - name: credentials
            emptyDir: {}
        steps:
          - name: get-kubeconfig
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-get-ephemeral-cluster-credentials/0.1/eaas-get-ephemeral-cluster-credentials.yaml
            params:
              - name: eaasSpaceSecretRef
                value: $(tasks.provision-eaas-space.results.secretRef)
              - name: clusterName
                value: "$(tasks.provision-cluster.results.clusterName)"
              - name: credentials
                value: credentials

          - name: setup-test-idp
            image: quay.io/rhoai/rhoai-task-toolset:kubeflow
            env:
              - name: KUBECONFIG
                value: "/credentials/$(steps.get-kubeconfig.results.kubeconfig)"
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            script: |
              #!/bin/bash
              set -e

              TEST_USER="test-user"
              TEST_PASSWORD="test-password123"
              IDP_CONFIGURED=false

              echo "=== Attempting htpasswd identity provider setup ==="
              echo "(This may fail on HyperShift clusters where OAuth is managed by the HostedCluster)"

              if yum install -y httpd-tools 2>/dev/null || dnf install -y httpd-tools 2>/dev/null; then
                  true
              fi

              if command -v htpasswd &>/dev/null; then
                  HTPASSWD_ENTRY=$(htpasswd -Bbn "${TEST_USER}" "${TEST_PASSWORD}")
              else
                  echo "htpasswd not available, generating hash with python"
                  HTPASSWD_ENTRY=$(python3 -c "
              import bcrypt, sys
              password = sys.argv[1].encode()
              hashed = bcrypt.hashpw(password, bcrypt.gensalt(rounds=10)).decode()
              print(f'{sys.argv[2]}:{hashed}')
              " "${TEST_PASSWORD}" "${TEST_USER}" 2>/dev/null || \
                  python3 -c "
              import hashlib, base64, os, sys
              password = sys.argv[1].encode()
              salt = os.urandom(16)
              dk = hashlib.pbkdf2_hmac('sha256', password, salt, 100000)
              print(f'{sys.argv[2]}:{{SSHA}}{base64.b64encode(dk + salt).decode()}')
              " "${TEST_PASSWORD}" "${TEST_USER}")
              fi

              echo "=== Creating htpasswd secret ==="
              oc create secret generic htpasswd-secret \
                  --from-literal=htpasswd="${HTPASSWD_ENTRY}" \
                  -n openshift-config 2>/dev/null || \
              oc create secret generic htpasswd-secret \
                  --from-literal=htpasswd="${HTPASSWD_ENTRY}" \
                  -n openshift-config --dry-run=client -o yaml | oc apply -f -

              echo "=== Patching OAuth to add htpasswd IDP ==="
              if oc patch oauth cluster --type=merge -p '{
                      "spec": {
                          "identityProviders": [{
                              "name": "htpasswd-provider",
                              "type": "HTPasswd",
                              "mappingMethod": "claim",
                              "htpasswd": {
                                  "fileData": {
                                      "name": "htpasswd-secret"
                                  }
                              }
                          }]
                      }
                  }' 2>&1; then
                  IDP_CONFIGURED=true
                  echo "=== Waiting for OAuth pods to roll out ==="
                  sleep 10
                  oc wait co/authentication --for=condition=Progressing=False --timeout=300s 2>/dev/null || true
                  oc rollout status deployment/oauth-openshift -n openshift-authentication --timeout=300s 2>/dev/null || true
              else
                  echo "WARNING: OAuth patching failed (expected on HyperShift clusters)."
                  echo "Tests requiring unprivileged user authentication will be skipped/error."
              fi

              echo "=== Creating openldap namespace and secret for test framework ==="
              oc create namespace openldap 2>/dev/null || true

              USERS_B64=$(echo -n "${TEST_USER}" | base64)
              PASSWORDS_B64=$(echo -n "${TEST_PASSWORD}" | base64)

              oc apply -f - <<EOF
              apiVersion: v1
              kind: Secret
              metadata:
                name: openldap
                namespace: openldap
              type: Opaque
              data:
                users: ${USERS_B64}
                passwords: ${PASSWORDS_B64}
              EOF

              echo "=== IDP setup summary ==="
              echo "IDP configured: ${IDP_CONFIGURED}"
              oc get secret openldap -n openldap
              echo "=== IDP setup step complete ==="

          - name: export-kubeconfig
            image: quay.io/konflux-ci/konflux-test:stable
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            script: |
              #!/bin/bash
              set -ex
              echo "=== Exporting kubeconfig to shared workspace ==="
              cp "/credentials/$(steps.get-kubeconfig.results.kubeconfig)" "$(workspaces.shared-data.path)/kubeconfig"
              echo "Kubeconfig exported."

    # ====================================================================
    # Phase 3: Install ODH and run tests (shared, mode-agnostic)
    # ====================================================================

    - name: install-odh-and-run-tests
      runAfter:
        - byo-prepare
        - hypershift-prepare
      params:
        - name: catalog-source-image
          value: $(params.catalog-source-image)
      workspaces:
        - name: shared-data
          workspace: shared-data
      taskSpec:
        params:
          - name: catalog-source-image
            type: string
        workspaces:
          - name: shared-data
        volumes:
          - name: artifacts
            emptyDir: {}
        steps:
          - name: install-odh-operator
            image: quay.io/rhoai/rhoai-task-toolset:kubeflow
            env:
              - name: KUBECONFIG
                value: "$(workspaces.shared-data.path)/kubeconfig"
              - name: CATALOG_SOURCE_IMAGE
                value: "$(params.catalog-source-image)"
            script: |
              #!/bin/bash
              set -ex

              echo "=== Cluster info ==="
              oc whoami
              oc version

              echo "=== Creating CatalogSource ==="
              oc apply -f - <<EOF
              apiVersion: operators.coreos.com/v1alpha1
              kind: CatalogSource
              metadata:
                name: odh-operator-catalog
                namespace: openshift-marketplace
              spec:
                sourceType: grpc
                image: ${CATALOG_SOURCE_IMAGE}
                displayName: ODH Operator Catalog
                publisher: Open Data Hub
                updateStrategy:
                  registryPoll:
                    interval: 10m
              EOF

              echo "=== Waiting for CatalogSource to be READY ==="
              for i in $(seq 1 60); do
                  STATE=$(oc get catalogsource odh-operator-catalog -n openshift-marketplace -o jsonpath='{.status.connectionState.lastObservedState}' 2>/dev/null || echo "")
                  if [[ "${STATE}" == "READY" ]]; then
                      echo "CatalogSource is READY"
                      break
                  fi
                  echo "  Waiting for CatalogSource... (attempt ${i}/60, state: ${STATE})"
                  sleep 10
              done

              if [[ "${STATE}" != "READY" ]]; then
                  echo "ERROR: CatalogSource did not become READY within timeout"
                  oc get catalogsource odh-operator-catalog -n openshift-marketplace -o yaml
                  exit 1
              fi

              echo "=== Creating operator namespace and OperatorGroup ==="
              oc create namespace redhat-ods-operator || true
              oc apply -f - <<EOF
              apiVersion: operators.coreos.com/v1
              kind: OperatorGroup
              metadata:
                name: redhat-ods-operator
                namespace: redhat-ods-operator
              spec: {}
              EOF

              echo "=== Creating Subscription ==="
              oc apply -f - <<EOF
              apiVersion: operators.coreos.com/v1alpha1
              kind: Subscription
              metadata:
                name: opendatahub-operator
                namespace: redhat-ods-operator
              spec:
                channel: odh-stable
                name: rhods-operator
                source: odh-operator-catalog
                sourceNamespace: openshift-marketplace
                installPlanApproval: Automatic
              EOF

              echo "=== Waiting for CSV to succeed ==="
              for i in $(seq 1 90); do
                  CSV_NAME=$(oc get subscription opendatahub-operator -n redhat-ods-operator -o jsonpath='{.status.installedCSV}' 2>/dev/null || echo "")
                  if [[ -n "${CSV_NAME}" ]]; then
                      PHASE=$(oc get csv "${CSV_NAME}" -n redhat-ods-operator -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                      if [[ "${PHASE}" == "Succeeded" ]]; then
                          echo "CSV ${CSV_NAME} succeeded"
                          break
                      fi
                      if [[ "${PHASE}" == "Failed" ]]; then
                          echo "ERROR: CSV ${CSV_NAME} entered Failed phase"
                          break
                      fi
                      echo "  CSV ${CSV_NAME} phase: ${PHASE} (attempt ${i}/90)"
                  else
                      echo "  Waiting for CSV to be created... (attempt ${i}/90)"
                  fi
                  sleep 10
              done

              if [[ "${PHASE}" != "Succeeded" ]]; then
                  echo "ERROR: CSV did not reach Succeeded phase (final phase: ${PHASE})"
                  echo "--- Subscription ---"
                  oc get subscription opendatahub-operator -n redhat-ods-operator -o yaml
                  if [[ -n "${CSV_NAME}" ]]; then
                      echo "--- CSV conditions ---"
                      oc get csv "${CSV_NAME}" -n redhat-ods-operator -o jsonpath='{range .status.conditions[*]}{.type}: {.reason} - {.message}{"\n"}{end}'
                      echo "--- Operator pods ---"
                      oc get pods -n redhat-ods-operator -o wide
                      echo "--- Pod events ---"
                      oc get events -n redhat-ods-operator --sort-by='.lastTimestamp' | tail -30
                      echo "--- Pod describe (if any) ---"
                      oc describe pods -n redhat-ods-operator -l name=rhods-operator 2>/dev/null | tail -50
                      echo "--- Init container logs (copy-manifests) ---"
                      oc logs -n redhat-ods-operator -l name=rhods-operator -c copy-manifests --tail=50 2>/dev/null || true
                  fi
                  exit 1
              fi

              echo "=== Operator installed successfully ==="
              oc get pods -n redhat-ods-operator -l control-plane=controller-manager

          - name: patch-controller-images
            image: quay.io/rhoai/rhoai-task-toolset:kubeflow
            env:
              - name: KUBECONFIG
                value: "$(workspaces.shared-data.path)/kubeconfig"
              - name: SNAPSHOT
                value: $(tasks.generate-snapshot.results.SNAPSHOT)
            script: |
              #!/bin/bash
              set -ex

              echo "=== Extracting PR-built controller images from snapshot ==="
              ODH_NOTEBOOK_CONTROLLER_IMAGE=$(jq -r '.["odh-notebook-controller-ci"].image' <<< "${SNAPSHOT}")
              KF_NOTEBOOK_CONTROLLER_IMAGE=$(jq -r '.["odh-kf-notebook-controller-ci"].image' <<< "${SNAPSHOT}")

              echo "ODH_NOTEBOOK_CONTROLLER_IMAGE: ${ODH_NOTEBOOK_CONTROLLER_IMAGE}"
              echo "KF_NOTEBOOK_CONTROLLER_IMAGE: ${KF_NOTEBOOK_CONTROLLER_IMAGE}"

              echo "=== Finding installed CSV ==="
              CSV_NAME=$(oc get subscription opendatahub-operator -n redhat-ods-operator \
                  -o jsonpath='{.status.installedCSV}')
              echo "CSV: ${CSV_NAME}"

              echo "=== Patching CSV env vars with PR-built controller images ==="
              CSV_JSON=$(oc get csv "${CSV_NAME}" -n redhat-ods-operator -o json)

              MANAGER_IDX=$(echo "${CSV_JSON}" | jq '[.spec.install.spec.deployments[0].spec.template.spec.containers[] | .env // [] | any(.name | startswith("RELATED_IMAGE_"))] | to_entries[] | select(.value == true) | .key')
              if [[ -z "${MANAGER_IDX}" ]]; then
                  echo "WARN: No container with RELATED_IMAGE_ env vars found, falling back to container 0"
                  MANAGER_IDX=0
              fi
              CONTAINER_NAME=$(echo "${CSV_JSON}" | jq -r ".spec.install.spec.deployments[0].spec.template.spec.containers[${MANAGER_IDX}].name")
              echo "Target container index: ${MANAGER_IDX} (name: ${CONTAINER_NAME})"

              ENV_JSON=$(echo "${CSV_JSON}" | jq ".spec.install.spec.deployments[0].spec.template.spec.containers[${MANAGER_IDX}].env")

              ODH_ENV_IDX=$(echo "${ENV_JSON}" | jq 'to_entries[] | select(.value.name == "RELATED_IMAGE_ODH_NOTEBOOK_CONTROLLER_IMAGE") | .key')
              KF_ENV_IDX=$(echo "${ENV_JSON}" | jq 'to_entries[] | select(.value.name == "RELATED_IMAGE_ODH_KF_NOTEBOOK_CONTROLLER_IMAGE") | .key')

              echo "ODH env var index: ${ODH_ENV_IDX}"
              echo "KF env var index: ${KF_ENV_IDX}"

              ENV_BASE="/spec/install/spec/deployments/0/spec/template/spec/containers/${MANAGER_IDX}/env"

              PATCH="["
              if [[ -n "${ODH_ENV_IDX}" ]]; then
                  PATCH="${PATCH}{\"op\":\"replace\",\"path\":\"${ENV_BASE}/${ODH_ENV_IDX}/value\",\"value\":\"${ODH_NOTEBOOK_CONTROLLER_IMAGE}\"},"
              else
                  PATCH="${PATCH}{\"op\":\"add\",\"path\":\"${ENV_BASE}/-\",\"value\":{\"name\":\"RELATED_IMAGE_ODH_NOTEBOOK_CONTROLLER_IMAGE\",\"value\":\"${ODH_NOTEBOOK_CONTROLLER_IMAGE}\"}},"
              fi
              if [[ -n "${KF_ENV_IDX}" ]]; then
                  PATCH="${PATCH}{\"op\":\"replace\",\"path\":\"${ENV_BASE}/${KF_ENV_IDX}/value\",\"value\":\"${KF_NOTEBOOK_CONTROLLER_IMAGE}\"}"
              else
                  PATCH="${PATCH}{\"op\":\"add\",\"path\":\"${ENV_BASE}/-\",\"value\":{\"name\":\"RELATED_IMAGE_ODH_KF_NOTEBOOK_CONTROLLER_IMAGE\",\"value\":\"${KF_NOTEBOOK_CONTROLLER_IMAGE}\"}}"
              fi
              PATCH="${PATCH}]"

              echo "Applying JSON patch to CSV:"
              echo "${PATCH}" | jq .

              oc patch csv "${CSV_NAME}" -n redhat-ods-operator \
                  --type=json \
                  -p "${PATCH}"

              echo "=== Verifying CSV patch ==="
              oc get csv "${CSV_NAME}" -n redhat-ods-operator -o json \
                  | jq '.spec.install.spec.deployments[].spec.template.spec.containers[].env[] | select(.name | startswith("RELATED_IMAGE_ODH_NOTEBOOK_CONTROLLER_IMAGE") or startswith("RELATED_IMAGE_ODH_KF_NOTEBOOK_CONTROLLER_IMAGE"))'

              echo "=== CSV patched with PR-built controller images ==="

          - name: create-dsc-and-wait
            image: quay.io/rhoai/rhoai-task-toolset:kubeflow
            env:
              - name: KUBECONFIG
                value: "$(workspaces.shared-data.path)/kubeconfig"
            script: |
              #!/bin/bash
              set -ex

              echo "=== Creating DSCInitialization ==="
              oc apply -f - <<EOF
              apiVersion: dscinitialization.opendatahub.io/v2
              kind: DSCInitialization
              metadata:
                name: default-dsci
                labels:
                  app.kubernetes.io/name: dscinitialization
              spec:
                monitoring:
                  metrics: {}
                  managementState: Managed
                  namespace: redhat-ods-monitoring
                trustedCABundle:
                  customCABundle: ''
                  managementState: Managed
                applicationsNamespace: redhat-ods-applications
              EOF

              echo "=== Waiting for DSCInitialization to be ready ==="
              DSCI_PHASE=""
              for i in $(seq 1 60); do
                  DSCI_PHASE=$(oc get dsci default-dsci -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                  if [[ "${DSCI_PHASE}" == "Ready" ]]; then
                      echo "DSCInitialization is Ready"
                      break
                  fi
                  echo "  DSCi phase: ${DSCI_PHASE} (attempt ${i}/60)"
                  sleep 10
              done

              if [[ "${DSCI_PHASE}" != "Ready" ]]; then
                  echo "ERROR: DSCInitialization did not reach Ready condition within timeout"
                  echo "--- DSCi status ---"
                  oc get dsci default-dsci -o yaml
                  echo "--- Operator pods ---"
                  oc get pods -n redhat-ods-operator -o wide
                  echo "--- Operator logs (last 100 lines) ---"
                  oc logs -n redhat-ods-operator -l name=rhods-operator --tail=100 2>/dev/null || true
                  echo "--- Events in redhat-ods-operator ---"
                  oc get events -n redhat-ods-operator --sort-by='.lastTimestamp' | tail -30
                  echo "--- Events in redhat-ods-applications ---"
                  oc get events -n redhat-ods-applications --sort-by='.lastTimestamp' | tail -30 2>/dev/null || true
                  exit 1
              fi

              echo "=== Creating DataScienceCluster ==="
              oc apply -f - <<EOF
              apiVersion: datasciencecluster.opendatahub.io/v2
              kind: DataScienceCluster
              metadata:
                labels:
                  app.kubernetes.io/name: datasciencecluster
                name: default-dsc
              spec:
                components:
                  workbenches:
                    managementState: Managed
                    workbenchNamespace: rhods-notebooks
                  dashboard:
                    managementState: Managed
                  aiPipelines:
                    managementState: Managed
                  modelregistry:
                    managementState: Removed
                    registriesNamespace: rhoai-model-registries
              EOF

              echo "=== Waiting for DataScienceCluster to be ready ==="
              for i in $(seq 1 60); do
                  PHASE=$(oc get dsc default-dsc -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                  if [[ "${PHASE}" == "Ready" ]]; then
                      echo "DataScienceCluster is Ready"
                      break
                  fi
                  echo "  DSC phase: ${PHASE} (attempt ${i}/60)"
                  sleep 15
              done

              if [[ "${PHASE}" != "Ready" ]]; then
                  echo "ERROR: DataScienceCluster did not reach Ready phase (final: ${PHASE})"
                  echo "--- DSC status ---"
                  oc get dsc default-dsc -o yaml
                  echo "--- DSCi status ---"
                  oc get dsci default-dsci -o yaml
                  echo "--- Pods in redhat-ods-applications ---"
                  oc get pods -n redhat-ods-applications -o wide
                  echo "--- Operator logs (last 100 lines) ---"
                  oc logs -n redhat-ods-operator -l name=rhods-operator --tail=100 2>/dev/null || true
                  echo "--- Events in redhat-ods-applications ---"
                  oc get events -n redhat-ods-applications --sort-by='.lastTimestamp' | tail -30
                  exit 1
              fi

              echo "=== Verifying controller deployments ==="
              oc get deployments -n redhat-ods-applications | grep -E "notebook-controller|odh-notebook-controller" || true

              echo "=== Verifying controller images match PR builds ==="
              oc get deployment -n redhat-ods-applications -o jsonpath='{range .items[*]}{.metadata.name}{": "}{range .spec.template.spec.containers[*]}{.image}{" "}{end}{"\n"}{end}'

              echo "=== ODH installation complete ==="

          - name: run-workbenches-tests
            image: quay.io/rhoai/rhoai-task-toolset:kubeflow
            computeResources:
              requests:
                memory: "4Gi"
                cpu: "2"
              limits:
                memory: "8Gi"
                cpu: "4"
            env:
              - name: KUBECONFIG
                value: "$(workspaces.shared-data.path)/kubeconfig"
            volumeMounts:
              - name: artifacts
                mountPath: /artifacts
            script: |
              #!/bin/bash
              set -ex

              echo "=== Installing uv ==="
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="${HOME}/.local/bin:${PATH}"
              uv --version

              echo "=== Cloning opendatahub-tests ==="
              git clone --depth 1 https://github.com/opendatahub-io/opendatahub-tests.git /workspace/opendatahub-tests
              cd /workspace/opendatahub-tests

              echo "=== Running workbenches e2e tests ==="
              OC_PATH=$(which oc 2>/dev/null || true)
              if [[ -n "${OC_PATH}" ]]; then
                  export OC_BINARY_PATH="${OC_PATH}"
                  echo "OC_BINARY_PATH=${OC_BINARY_PATH} (reusing oc from image)"
              else
                  echo "oc binary not found on image, tests will download it if needed"
              fi
              uv run pytest tests/workbenches/ \
                  -v \
                  --tb=short \
                  --junitxml=/artifacts/junit-workbenches.xml \
                  -o console_output_style=count \
                  2>&1 | tee /artifacts/pytest-output.log
              TEST_EXIT_CODE=${PIPESTATUS[0]}

