---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: kubeflow-promotion-e2e-gate
spec:
  description: |
    E2E gate for kubeflow branch promotions (main->stable, stable->v1.10-branch).
    Provisions an ephemeral HyperShift cluster, installs ODH from CatalogSource,
    patches controller images with PR-built versions, and runs the opendatahub-tests
    workbenches suite.
  params:
    - description: List of components in the group
      name: group-components
      type: string
    - description: CatalogSource index image for the ODH operator
      name: catalog-source-image
      type: string
      default: quay.io/opendatahub/opendatahub-operator-catalog:odh-stable
  tasks:
    - name: generate-snapshot
      description: Resolve the latest built images for the group components
      params:
        - name: COMPONENTS
          value: $(params.group-components)
      workspaces:
      - name: basic-auth
        workspace: git-auth
      taskRef:
        resolver: git
        params:
        - name: url
          value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
        - name: revision
          value: main
        - name: pathInRepo
          value: konflux-tekton-tasks/generate-snapshot-for-group-testing/0.1/generate-snapshot-for-group-testing.yaml

    - name: audit-snapshot
      runAfter:
        - generate-snapshot
      params:
        - name: COMPONENTS
          value: $(params.group-components)
      taskSpec:
        params:
          - name: COMPONENTS
            description: List of components in the group
        steps:
          - name: audit-snapshot
            image: quay.io/konflux-ci/konflux-test:stable
            workingDir: /workspace
            env:
              - name: SNAPSHOT
                value: $(tasks.generate-snapshot.results.SNAPSHOT)
              - name: COMPONENTS
                value: $(params.COMPONENTS)
            script: |
              #!/bin/bash
              set -e
              echo "SNAPSHOT=${SNAPSHOT}"

              while IFS= read -r row; do
                  COMPONENT_NAME=$(echo "$row" | base64 -d | jq -r '.key')
                  IMAGE=$(jq -r --arg component_name "${COMPONENT_NAME}" '.[$component_name].image' <<< "${SNAPSHOT}")
                  GIT_COMMIT=$(jq -r --arg component_name "${COMPONENT_NAME}" '.[$component_name]."git.commit"' <<< "${SNAPSHOT}")
                  GIT_URL=$(jq -r --arg component_name "${COMPONENT_NAME}" '.[$component_name]."git.url"' <<< "${SNAPSHOT}")
                  echo "${COMPONENT_NAME} IMAGE: ${IMAGE}"
                  echo "  GIT_COMMIT=${GIT_COMMIT}"
                  echo "  GIT_URL=${GIT_URL}"
              done < <(echo "$COMPONENTS" | jq -r 'to_entries[] | @base64')

    - name: provision-eaas-space
      runAfter:
        - audit-snapshot
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/build-definitions.git
          - name: revision
            value: main
          - name: pathInRepo
            value: task/eaas-provision-space/0.1/eaas-provision-space.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)

    - name: provision-cluster
      runAfter:
        - provision-eaas-space
      taskSpec:
        results:
          - name: clusterName
            value: "$(steps.create-cluster.results.clusterName)"
        steps:
          - name: get-supported-versions
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-get-supported-ephemeral-cluster-versions/0.1/eaas-get-supported-ephemeral-cluster-versions.yaml
            params:
              - name: eaasSpaceSecretRef
                value: $(tasks.provision-eaas-space.results.secretRef)
          - name: pick-version
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-get-latest-openshift-version-by-prefix/0.1/eaas-get-latest-openshift-version-by-prefix.yaml
            params:
              - name: prefix
                value: "$(steps.get-supported-versions.results.versions[0])."
          - name: create-cluster
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-create-ephemeral-cluster-hypershift-aws/0.1/eaas-create-ephemeral-cluster-hypershift-aws.yaml
            params:
              - name: eaasSpaceSecretRef
                value: $(tasks.provision-eaas-space.results.secretRef)
              - name: version
                value: "$(steps.pick-version.results.version)"
              - name: instanceType
                value: m5.2xlarge

    - name: install-odh-and-run-tests
      runAfter:
        - provision-cluster
      params:
        - name: catalog-source-image
          value: $(params.catalog-source-image)
      taskSpec:
        params:
          - name: catalog-source-image
            type: string
        volumes:
          - name: credentials
            emptyDir: {}
          - name: artifacts
            emptyDir: {}
        steps:
          - name: get-kubeconfig
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-get-ephemeral-cluster-credentials/0.1/eaas-get-ephemeral-cluster-credentials.yaml
            params:
              - name: eaasSpaceSecretRef
                value: $(tasks.provision-eaas-space.results.secretRef)
              - name: clusterName
                value: "$(tasks.provision-cluster.results.clusterName)"
              - name: credentials
                value: credentials

          - name: install-odh-operator
            image: quay.io/rhoai/rhoai-task-toolset:kubeflow
            env:
              - name: KUBECONFIG
                value: "/credentials/$(steps.get-kubeconfig.results.kubeconfig)"
              - name: CATALOG_SOURCE_IMAGE
                value: "$(params.catalog-source-image)"
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            script: |
              #!/bin/bash
              set -ex

              echo "=== Cluster info ==="
              oc whoami
              oc version

              echo "=== Creating CatalogSource ==="
              oc apply -f - <<EOF
              apiVersion: operators.coreos.com/v1alpha1
              kind: CatalogSource
              metadata:
                name: odh-operator-catalog
                namespace: openshift-marketplace
              spec:
                sourceType: grpc
                image: ${CATALOG_SOURCE_IMAGE}
                displayName: ODH Operator Catalog
                publisher: Open Data Hub
                updateStrategy:
                  registryPoll:
                    interval: 10m
              EOF

              echo "=== Waiting for CatalogSource to be READY ==="
              for i in $(seq 1 60); do
                  STATE=$(oc get catalogsource odh-operator-catalog -n openshift-marketplace -o jsonpath='{.status.connectionState.lastObservedState}' 2>/dev/null || echo "")
                  if [[ "${STATE}" == "READY" ]]; then
                      echo "CatalogSource is READY"
                      break
                  fi
                  echo "  Waiting for CatalogSource... (attempt ${i}/60, state: ${STATE})"
                  sleep 10
              done

              if [[ "${STATE}" != "READY" ]]; then
                  echo "ERROR: CatalogSource did not become READY within timeout"
                  oc get catalogsource odh-operator-catalog -n openshift-marketplace -o yaml
                  exit 1
              fi

              echo "=== Creating operator namespace and OperatorGroup ==="
              oc create namespace redhat-ods-operator || true
              oc apply -f - <<EOF
              apiVersion: operators.coreos.com/v1
              kind: OperatorGroup
              metadata:
                name: redhat-ods-operator
                namespace: redhat-ods-operator
              spec: {}
              EOF

              echo "=== Creating Subscription ==="
              oc apply -f - <<EOF
              apiVersion: operators.coreos.com/v1alpha1
              kind: Subscription
              metadata:
                name: opendatahub-operator
                namespace: redhat-ods-operator
              spec:
                channel: odh-stable
                name: rhods-operator
                source: odh-operator-catalog
                sourceNamespace: openshift-marketplace
                installPlanApproval: Automatic
              EOF

              echo "=== Waiting for CSV to succeed ==="
              for i in $(seq 1 90); do
                  CSV_NAME=$(oc get subscription opendatahub-operator -n redhat-ods-operator -o jsonpath='{.status.installedCSV}' 2>/dev/null || echo "")
                  if [[ -n "${CSV_NAME}" ]]; then
                      PHASE=$(oc get csv "${CSV_NAME}" -n redhat-ods-operator -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                      if [[ "${PHASE}" == "Succeeded" ]]; then
                          echo "CSV ${CSV_NAME} succeeded"
                          break
                      fi
                      if [[ "${PHASE}" == "Failed" ]]; then
                          echo "ERROR: CSV ${CSV_NAME} entered Failed phase"
                          break
                      fi
                      echo "  CSV ${CSV_NAME} phase: ${PHASE} (attempt ${i}/90)"
                  else
                      echo "  Waiting for CSV to be created... (attempt ${i}/90)"
                  fi
                  sleep 10
              done

              if [[ "${PHASE}" != "Succeeded" ]]; then
                  echo "ERROR: CSV did not reach Succeeded phase (final phase: ${PHASE})"
                  echo "--- Subscription ---"
                  oc get subscription opendatahub-operator -n redhat-ods-operator -o yaml
                  if [[ -n "${CSV_NAME}" ]]; then
                      echo "--- CSV conditions ---"
                      oc get csv "${CSV_NAME}" -n redhat-ods-operator -o jsonpath='{range .status.conditions[*]}{.type}: {.reason} - {.message}{"\n"}{end}'
                      echo "--- Operator pods ---"
                      oc get pods -n redhat-ods-operator -o wide
                      echo "--- Pod events ---"
                      oc get events -n redhat-ods-operator --sort-by='.lastTimestamp' | tail -30
                      echo "--- Pod describe (if any) ---"
                      oc describe pods -n redhat-ods-operator -l name=rhods-operator 2>/dev/null | tail -50
                      echo "--- Init container logs (copy-manifests) ---"
                      oc logs -n redhat-ods-operator -l name=rhods-operator -c copy-manifests --tail=50 2>/dev/null || true
                  fi
                  exit 1
              fi

              echo "=== Operator installed successfully ==="
              oc get pods -n redhat-ods-operator -l control-plane=controller-manager

          - name: patch-controller-images
            image: quay.io/rhoai/rhoai-task-toolset:kubeflow
            env:
              - name: KUBECONFIG
                value: "/credentials/$(steps.get-kubeconfig.results.kubeconfig)"
              - name: SNAPSHOT
                value: $(tasks.generate-snapshot.results.SNAPSHOT)
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            script: |
              #!/bin/bash
              set -ex

              echo "=== Extracting PR-built controller images from snapshot ==="
              ODH_NOTEBOOK_CONTROLLER_IMAGE=$(jq -r '.["odh-notebook-controller-ci"].image' <<< "${SNAPSHOT}")
              KF_NOTEBOOK_CONTROLLER_IMAGE=$(jq -r '.["odh-kf-notebook-controller-ci"].image' <<< "${SNAPSHOT}")

              echo "ODH_NOTEBOOK_CONTROLLER_IMAGE: ${ODH_NOTEBOOK_CONTROLLER_IMAGE}"
              echo "KF_NOTEBOOK_CONTROLLER_IMAGE: ${KF_NOTEBOOK_CONTROLLER_IMAGE}"

              # The operator deployment is owned by the CSV -- patching the deployment
              # directly gets reverted by OLM. We patch the CSV so that OLM propagates
              # the changes to the deployment. Since DSCi/DSC are not created yet,
              # there is no need to wait for rollout here -- the operator will pick up
              # the patched images when it reconciles the DSC in the next step.

              echo "=== Finding installed CSV ==="
              CSV_NAME=$(oc get subscription opendatahub-operator -n redhat-ods-operator \
                  -o jsonpath='{.status.installedCSV}')
              echo "CSV: ${CSV_NAME}"

              echo "=== Patching CSV env vars with PR-built controller images ==="
              DEPLOY_IDX=0

              MANAGER_IDX=$(oc get csv "${CSV_NAME}" -n redhat-ods-operator \
                  -o jsonpath="{.spec.install.spec.deployments[${DEPLOY_IDX}].spec.template.spec.containers[*].name}" \
                  | tr ' ' '\n' | grep -n 'manager' | cut -d: -f1)
              MANAGER_IDX=$((MANAGER_IDX - 1))
              echo "Manager container index: ${MANAGER_IDX}"

              ENV_JSON=$(oc get csv "${CSV_NAME}" -n redhat-ods-operator \
                  -o jsonpath="{.spec.install.spec.deployments[${DEPLOY_IDX}].spec.template.spec.containers[${MANAGER_IDX}].env}")

              ODH_ENV_IDX=$(echo "${ENV_JSON}" | jq 'to_entries[] | select(.value.name == "RELATED_IMAGE_ODH_NOTEBOOK_CONTROLLER_IMAGE") | .key')
              KF_ENV_IDX=$(echo "${ENV_JSON}" | jq 'to_entries[] | select(.value.name == "RELATED_IMAGE_ODH_KF_NOTEBOOK_CONTROLLER_IMAGE") | .key')

              echo "ODH env var index: ${ODH_ENV_IDX}"
              echo "KF env var index: ${KF_ENV_IDX}"

              ENV_BASE="/spec/install/spec/deployments/${DEPLOY_IDX}/spec/template/spec/containers/${MANAGER_IDX}/env"

              PATCH="["
              if [[ -n "${ODH_ENV_IDX}" ]]; then
                  PATCH="${PATCH}{\"op\":\"replace\",\"path\":\"${ENV_BASE}/${ODH_ENV_IDX}/value\",\"value\":\"${ODH_NOTEBOOK_CONTROLLER_IMAGE}\"},"
              else
                  PATCH="${PATCH}{\"op\":\"add\",\"path\":\"${ENV_BASE}/-\",\"value\":{\"name\":\"RELATED_IMAGE_ODH_NOTEBOOK_CONTROLLER_IMAGE\",\"value\":\"${ODH_NOTEBOOK_CONTROLLER_IMAGE}\"}},"
              fi
              if [[ -n "${KF_ENV_IDX}" ]]; then
                  PATCH="${PATCH}{\"op\":\"replace\",\"path\":\"${ENV_BASE}/${KF_ENV_IDX}/value\",\"value\":\"${KF_NOTEBOOK_CONTROLLER_IMAGE}\"}"
              else
                  PATCH="${PATCH}{\"op\":\"add\",\"path\":\"${ENV_BASE}/-\",\"value\":{\"name\":\"RELATED_IMAGE_ODH_KF_NOTEBOOK_CONTROLLER_IMAGE\",\"value\":\"${KF_NOTEBOOK_CONTROLLER_IMAGE}\"}}"
              fi
              PATCH="${PATCH}]"

              echo "Applying JSON patch to CSV:"
              echo "${PATCH}" | jq .

              oc patch csv "${CSV_NAME}" -n redhat-ods-operator \
                  --type=json \
                  -p "${PATCH}"

              echo "=== Verifying CSV patch ==="
              oc get csv "${CSV_NAME}" -n redhat-ods-operator -o json \
                  | jq '.spec.install.spec.deployments[].spec.template.spec.containers[].env[] | select(.name | startswith("RELATED_IMAGE_ODH_NOTEBOOK_CONTROLLER_IMAGE") or startswith("RELATED_IMAGE_ODH_KF_NOTEBOOK_CONTROLLER_IMAGE"))'

              echo "=== CSV patched with PR-built controller images ==="

          - name: create-dsc-and-wait
            image: quay.io/rhoai/rhoai-task-toolset:kubeflow
            env:
              - name: KUBECONFIG
                value: "/credentials/$(steps.get-kubeconfig.results.kubeconfig)"
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            script: |
              #!/bin/bash
              set -ex

              echo "=== Creating DSCInitialization ==="
              oc apply -f - <<EOF
              apiVersion: dscinitialization.opendatahub.io/v2
              kind: DSCInitialization
              metadata:
                name: default-dsci
                labels:
                  app.kubernetes.io/name: dscinitialization
              spec:
                monitoring:
                  metrics: {}
                  managementState: Managed
                  namespace: redhat-ods-monitoring
                trustedCABundle:
                  customCABundle: ''
                  managementState: Managed
                applicationsNamespace: redhat-ods-applications
              EOF

              echo "=== Creating DataScienceCluster ==="
              oc apply -f - <<EOF
              apiVersion: datasciencecluster.opendatahub.io/v2
              kind: DataScienceCluster
              metadata:
                labels:
                  app.kubernetes.io/name: datasciencecluster
                name: default-dsc
              spec:
                components:
                  workbenches:
                    managementState: Managed
                    workbenchNamespace: rhods-notebooks
                  dashboard:
                    managementState: Managed
                  aiPipelines:
                    managementState: Managed
              EOF

              echo "=== Waiting for DSCInitialization to be ready ==="
              oc wait --for=condition=Ready dsci/default-dsci --timeout=300s

              echo "=== Waiting for DataScienceCluster to be ready ==="
              for i in $(seq 1 60); do
                  PHASE=$(oc get dsc default-dsc -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                  if [[ "${PHASE}" == "Ready" ]]; then
                      echo "DataScienceCluster is Ready"
                      break
                  fi
                  echo "  DSC phase: ${PHASE} (attempt ${i}/60)"
                  sleep 15
              done

              if [[ "${PHASE}" != "Ready" ]]; then
                  echo "ERROR: DataScienceCluster did not reach Ready phase"
                  oc get dsc default-dsc -o yaml
                  oc get pods -n redhat-ods-applications
                  exit 1
              fi

              echo "=== Verifying controller deployments ==="
              oc get deployments -n redhat-ods-applications | grep -E "notebook-controller|odh-notebook-controller" || true

              echo "=== Verifying controller images match PR builds ==="
              oc get deployment -n redhat-ods-applications -o jsonpath='{range .items[*]}{.metadata.name}{": "}{range .spec.template.spec.containers[*]}{.image}{" "}{end}{"\n"}{end}'

              echo "=== ODH installation complete ==="

          - name: run-workbenches-tests
            image: quay.io/rhoai/rhoai-task-toolset:kubeflow
            computeResources:
              requests:
                memory: "4Gi"
                cpu: "2"
              limits:
                memory: "8Gi"
                cpu: "4"
            env:
              - name: KUBECONFIG
                value: "/credentials/$(steps.get-kubeconfig.results.kubeconfig)"
            volumeMounts:
              - name: credentials
                mountPath: /credentials
              - name: artifacts
                mountPath: /artifacts
            script: |
              #!/bin/bash
              set -ex

              # TODO: Future step for installing uv - we may install this directly in the image
              echo "=== Installing uv ==="
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="${HOME}/.local/bin:${PATH}"
              uv --version

              echo "=== Cloning opendatahub-tests ==="
              git clone --depth 1 https://github.com/opendatahub-io/opendatahub-tests.git /workspace/opendatahub-tests
              cd /workspace/opendatahub-tests

              echo "=== Running workbenches e2e tests ==="
              uv run pytest tests/workbenches/ \
                  -v \
                  --tb=short \
                  --junitxml=/artifacts/junit-workbenches.xml \
                  -o console_output_style=count \
                  2>&1 | tee /artifacts/pytest-output.log
              TEST_EXIT_CODE=${PIPESTATUS[0]}

              echo "=== Test exit code: ${TEST_EXIT_CODE} ==="
              exit ${TEST_EXIT_CODE}

          # TODO: Future step for UI tests (ods-ci or odh-dashboard Cypress)
          # - name: run-ui-tests
          #   image: <tbd - cypress or robotframework image>
          #   ...

          - name: collect-artifacts
            image: quay.io/rhoai/rhoai-task-toolset:kubeflow
            env:
              - name: KUBECONFIG
                value: "/credentials/$(steps.get-kubeconfig.results.kubeconfig)"
            volumeMounts:
              - name: credentials
                mountPath: /credentials
              - name: artifacts
                mountPath: /artifacts
            onError: continue
            script: |
              #!/bin/bash
              set +e

              echo "=== Collecting diagnostic artifacts ==="

              echo "--- Controller pods ---"
              oc get pods -n redhat-ods-applications -o wide 2>&1 | tee /artifacts/pods-redhat-ods-applications.txt

              echo "--- Operator pods ---"
              oc get pods -n redhat-ods-operator -l control-plane=controller-manager -o wide 2>&1 | tee /artifacts/pods-operator.txt

              echo "--- Controller logs (odh-notebook-controller) ---"
              oc logs -n redhat-ods-applications -l app=odh-notebook-controller --tail=200 2>&1 | tee /artifacts/logs-odh-notebook-controller.txt

              echo "--- Controller logs (notebook-controller) ---"
              oc logs -n redhat-ods-applications -l app=notebook-controller --tail=200 2>&1 | tee /artifacts/logs-notebook-controller.txt

              echo "--- Operator logs ---"
              oc logs -n redhat-ods-operator -l control-plane=controller-manager --tail=200 2>&1 | tee /artifacts/logs-operator.txt

              echo "--- DSC status ---"
              oc get dsc default-dsc -o yaml 2>&1 | tee /artifacts/dsc-status.yaml

              echo "--- Notebooks ---"
              oc get notebooks --all-namespaces -o wide 2>&1 | tee /artifacts/notebooks.txt

              echo "--- Events ---"
              oc get events -n redhat-ods-applications --sort-by='.lastTimestamp' 2>&1 | tee /artifacts/events-redhat-ods-applications.txt

              echo "=== Artifacts collected in /artifacts/ ==="
              ls -la /artifacts/

  workspaces:
  - name: git-auth
    optional: true
