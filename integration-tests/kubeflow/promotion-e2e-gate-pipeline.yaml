  # ====================================================================
  # Finally: collect artifacts and release cluster lock
  # ====================================================================

  finally:
    - name: collect-artifacts
      workspaces:
        - name: shared-data
          workspace: shared-data
      taskSpec:
        workspaces:
          - name: shared-data
        steps:
          - name: collect
            image: quay.io/rhoai/rhoai-task-toolset:kubeflow
            env:
              - name: KUBECONFIG
                value: "$(workspaces.shared-data.path)/kubeconfig"
            script: |
              #!/bin/bash
              set +e

              if [[ ! -f "${KUBECONFIG}" ]]; then
                  echo "No kubeconfig found in shared workspace, skipping artifact collection."
                  exit 0
              fi

              echo "=== Collecting diagnostic artifacts ==="

              echo "--- Controller pods ---"
              oc get pods -n redhat-ods-applications -o wide

              echo "--- Operator pods ---"
              oc get pods -n redhat-ods-operator -o wide

              echo "--- Controller logs (odh-notebook-controller) ---"
              oc logs -n redhat-ods-applications -l app=odh-notebook-controller --tail=200 2>/dev/null || true

              echo "--- Controller logs (notebook-controller) ---"
              oc logs -n redhat-ods-applications -l app=notebook-controller --tail=200 2>/dev/null || true

              echo "--- Operator logs ---"
              oc logs -n redhat-ods-operator -l name=rhods-operator --tail=200 2>/dev/null || true

              echo "--- DSCi status ---"
              oc get dsci default-dsci -o yaml 2>/dev/null || true

              echo "--- DSC status ---"
              oc get dsc default-dsc -o yaml 2>/dev/null || true

              echo "--- Notebooks ---"
              oc get notebooks --all-namespaces -o wide 2>/dev/null || true

              echo "--- Events (redhat-ods-operator) ---"
              oc get events -n redhat-ods-operator --sort-by='.lastTimestamp' 2>/dev/null | tail -30 || true

              echo "--- Events (redhat-ods-applications) ---"
              oc get events -n redhat-ods-applications --sort-by='.lastTimestamp' 2>/dev/null | tail -30 || true

              echo "=== Artifact collection complete ==="

    - name: release-cluster-lock
      when:
        - input: $(params.cluster-mode)
          operator: in
          values: ["byo"]
      taskSpec:
        params:
          - name: pipeline-run-name
            type: string
        steps:
          - name: release-lock
            image: quay.io/konflux-ci/konflux-test:stable
            env:
              - name: HOLDER
                value: "$(params.pipeline-run-name)"
            script: |
              #!/bin/bash
              set -e

              LEASE_NAME="e2e-gate-cluster-lock"
              NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)

              echo "=== Releasing cluster lock ==="
              CURRENT_HOLDER=$(kubectl get lease "${LEASE_NAME}" -n "${NAMESPACE}" -o jsonpath='{.spec.holderIdentity}' 2>/dev/null || echo "")

              if [[ "${CURRENT_HOLDER}" == "${HOLDER}" ]]; then
                  kubectl delete lease "${LEASE_NAME}" -n "${NAMESPACE}"
                  echo "Lock released."
              elif [[ -z "${CURRENT_HOLDER}" ]]; then
                  echo "No lock found, nothing to release."
              else
                  echo "WARNING: Lock held by '${CURRENT_HOLDER}', not '${HOLDER}'. Not releasing."
              fi
      params:
        - name: pipeline-run-name
          value: $(context.pipelineRun.name)
